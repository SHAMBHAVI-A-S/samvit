sensA:()=>{const a=A[sel],e=a.hist.at(-1);return `<h2>Sensor health for ${a.n}</h2><table><tr><th>Sensor<th>Status<th>Last value<th>What to do<th>Simulate a fault</tr>`+SENS.map(i=>{const q=a.sq[i];return `<tr class='s${q?1:0}'><td>${SN[i]}<td><span class='chip'>${q?'Needs a look':'OK'}</span><td>${f1(i,e.v[i])} ${IND[i][1]}<td>${q?q.l+'. '+q.d+` <button data-rc='${i}'>Recalibrate</button>`:'Readings look consistent.'}<td>${['stuck','noisy','drift','spike'].map(t=>`<button data-sf='${i}:${t}'>${t}</button>`).join(' ')}</tr>`}).join('')+`</table><small>Checks: impossible value, stuck reading, noisy signal, and drift that no other vital confirms. An impossible reading is ignored; every other flag keeps the reading in use and asks for a manual check, so a real emergency is never silenced.</small><hr>`+T.sensB()},
aidB:()=>{const g=FA[selG];return `<h2>First aid guides</h2><div class='r' style='flex-wrap:wrap'>`+Object.keys(FA).map(k=>`<button data-g='${k}' class='${k==selG?'on':''}'>${FA[k][0]}</button>`).join('')+`</div><h2>${g[0]}</h2><ol>`+g[1].map(s=>`<li>${s}</li>`).join('')+`</ol><small>General first-aid information for this prototype only. Announce the emergency, note the time, restrain the patient, keep monitoring and report to the flight surgeon (signal delay: ${ENV[env][3]}). Follow the mission medical checklist.</small><h2>When do alerts sound?</h2><div class='ac s2'><b>Voice call: “${A[sel].n} emergency”</b><br><small>Only for a life-threatening reading: SpO₂ below 85%, temperature 40 °C or above (or below 34 °C), glucose below 40 or above 400 mg/dL, systolic pressure below 70 or above 200 mmHg, or resting heart rate above 160 or below 35 bpm. The simulation pauses and the matching first-aid steps open.</small></div><div class='ac s1'><b>Beep only</b><br><small>A new Attention status, or a red-flag value: SpO₂ below 90%, fever of 38.0 °C or higher, resting heart rate above 120 bpm, systolic pressure of 180 or higher, glucose below 54 or above 250 mg/dL. Habitat readings outside their safe range also beep. Watch status is silent.</small></div>`},
about:()=>`<div class="cols"><div><h2>About SAMVIT</h2><p>Space Astronaut Monitoring, Vital Intelligence and Tracking. Created by ${esc(CREATORS)}. ${esc(MISSION)}.</p><h2>How it works</h2><ul><li><b>Hourly monitoring.</b> Every simulated hour each astronaut’s suit reports vitals together with the activity before, during and after.</li><li><b>Context-aware baselines.</b> Each reading is compared with that astronaut’s own baseline plus the expected effect of the current activity, so a workout is not an alarm but slow recovery is noticed.</li><li><b>Detection.</b> Each reading is compared with the astronaut’s expected value for the activity. Three detectors run together: an exponentially weighted average (sudden shifts), a one-sided CUSUM (slow drift) and absolute clinical limits (sharp events). Sensor quality checks run alongside and flag stuck, noisy, impossible or lone-drifting readings.</li><li><b>Risk model.</b> Indicator severities feed NASA-named risks through a noisy-OR, risks feed the five hazards, and CHI = 1 − Π(1 − hazard), raised 15% per extra hazard above 0.25. The setting rescales hazard weights. Weights are illustrative.</li><li><b>Offline.</b> The whole app is one file and runs on this device with no internet connection and no outside service.</li><li><b>Measured on simulated data.</b> Over 33,600 simulated crew-hours of normal operation the engine raised about 1 false Watch and 0.2 false Attention per 1,000 crew-hours. Scripted events were caught after about 5 h (infection), 8 h (sleep disruption), 3 h (CO₂ rise) and 1 h (critical drill). Real crews will differ.</li><li><b>SI use.</b> The code was written with the help of an SI assistant (Claude, Anthropic) under the team’s direction. No NASA logos or branding were generated.</li><li><b>Limits.</b> Sensor feeds are simulated; manual log entries are the user’s own input. Bone and immune statuses are proxies. The camera pulse is sensitive to motion, light and skin tone. Not a medical device; actions carry no drug doses.</li></ul></div><div><h2>Answers to the challenge brief</h2><ul><li><b>Measurements in space:</b> suit sensors, cuff, glucometer, wearable and camera.</li><li><b>Why exams:</b> hourly records expose drift that occasional exams miss.</li><li><b>Hazards to indicators:</b> body map and hazard bars link each reading to NASA risks.</li><li><b>When to escalate:</b> three-step ladder, red flags and a delay countdown.</li><li><b>Routine and engagement:</b> due-now checks, manual vitals log, points, streaks and badges.</li><li><b>Preventive actions:</b> an action card for every flagged risk.</li></ul><small>Sources: <a href="https://www.nasa.gov/hrp/hazards/" target="_blank" rel="noopener">NASA hazards</a>, <a href="https://www.nasa.gov/hrp/risks/" target="_blank" rel="noopener">NASA risks</a>, <a href="https://www.nasa.gov/hrp/ongoing-hrp-research/" target="_blank" rel="noopener">NASA HRP research</a>, <a href="https://www.asc-csa.gc.ca/eng/news/articles/2026/2026-02-26-monitoring-radiation-astronaut-health.asp" target="_blank" rel="noopener">CSA radiation monitoring</a>, <a href="https://www.asc-csa.gc.ca/eng/iss/science/why-do-we-conduct-science-experiments-in-space.asp" target="_blank" rel="noopener">CSA space science</a>. Radiation rates and delays are simulated.</small></div></div>`};

function pulse(Tm,X){const n=X.length,fs=n/(Tm[n-1]-Tm[0]),w=Math.round(fs*1.5),Y=X.map((x,i)=>{let s=0,c=0;for(let j=mx(0,i-w);j<=Math.min(n-1,i+w);j++){s+=X[j];c++}return x-s/c});
const P=[];let tot=0,bi=0;for(let f=.7;f<=3;f+=.01){let re=0,im=0;for(let i=0;i<n;i++){const a=6.2832*f*Tm[i];re+=Y[i]*Math.cos(a);im+=Y[i]*Math.sin(a)}const p=re*re+im*im;P.push(p);tot+=p;if(p>P[bi])bi=P.length-1}
const q=P.slice(mx(0,bi-10),bi+11).reduce((a,b)=>a+b,0)/tot,bpm=(.7+bi*.01)*60,m=A[sel].hist.at(-1).v.hr;if(q>=.4&&Math.abs(bpm-m)>15)A[sel].sq.hr={l:"Disagrees with camera pulse",d:"Suit "+m.toFixed(0)+" bpm vs camera "+bpm.toFixed(0)+" bpm: check the sensor.",h:H};SCT=ch([{d:Y.slice(-240),c:"#7fd0ff"}]);put("#tr",SCT);
SCM=$("#sc").textContent=`Pulse about ${bpm.toFixed(0)} bpm, signal quality ${q.toFixed(2)} (${q>=.4?"good":q>=.25?"fair":"poor"}). `+(q<.25?"Too noisy: improve light, hold still and retry.":Math.abs(bpm-m)>10?`Differs from the suit reading (${m.toFixed(0)} bpm) by more than 10 bpm: re-measure.`:`Agrees with the suit reading (${m.toFixed(0)} bpm).`)}

$("#sb").onclick=async()=>{const o=$("#sc"),Tm=[],X=[];let st;try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}})}catch(e){o.textContent="Camera is not available in this view. Run the demo signal, or open the page locally for live capture.";return}
const v=$("#vid");v.srcObject=st;scanning=true;$("#cam").hidden=false;await v.play();const c=document.createElement("canvas"),x=c.getContext("2d",{willReadFrequently:true});c.width=48;c.height=36;const t0=performance.now();
await new Promise(res=>{(function f(){const e=(performance.now()-t0)/1000;o.textContent="Hold still with your face in view: "+mx(0,20-e).toFixed(0)+" s";if(e>20)return res();x.drawImage(v,v.videoWidth*.3,v.videoHeight*.1,v.videoWidth*.4,v.videoHeight*.25,0,0,48,36);const d=x.getImageData(0,0,48,36).data;let g=0;for(let i=1;i<d.length;i+=4)g+=d[i];Tm.push(e);X.push(g/(d.length/4));setTimeout(f,33)})()});
